# Pin the interpreter. Nixpacks otherwise picks whatever it considers current,
# and the project targets 3.11+ with wheels verified on 3.12.
[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "python -m pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "python start.py"
