# ==========================================================================
# Alembic configuration.
#
# `sqlalchemy.url` is deliberately EMPTY. The database location is an
# environment variable (DATABASE_URL, default sqlite:///data/towbook.db) and
# lives in exactly one place: env.py asks towbook_agent.core.db for it, which
# means alembic and the application can never disagree about which file they
# are opening -- and no connection string is ever committed.
#
#   alembic upgrade head          apply every migration
#   alembic downgrade -1          undo the last one
#   alembic revision --autogenerate -m "add x"
#
# Set the URL for a one-off run without touching this file:
#   alembic -x url=sqlite:///data/scratch.db upgrade head
#   DATABASE_URL=... alembic upgrade head
# ==========================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped, sortable, and readable in a directory listing.
file_template = %%(rev)s_%%(slug)s

# Empty on purpose -- see the header. env.py supplies the URL.
sqlalchemy.url =


# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
