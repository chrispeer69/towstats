[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "towbook-agent"
version = "0.1.0"
description = "Towbook Job Acceptance Intelligence System - watches the Digital Requests log, classifies offers against YAML rules, and reports acceptance metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Towbook Agent" }]
keywords = ["towbook", "towing", "dispatch", "automation", "metrics"]

# NOTE: pandas and numpy are deliberately absent. Wheel availability on
# Python 3.14 is a real risk and neither is needed -- XLSX is handled by
# openpyxl and all aggregation is plain Python and SQL.
# Playwright is NOT here. It is an extra (`.[ui]`), because the default
# acquisition path is `source: api` -- plain HTTP through httpx, no browser --
# and every playwright import in agents/acquisition.py is lazy or behind
# TYPE_CHECKING. A container without browsers therefore runs the whole system.
dependencies = [
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    # PostgreSQL driver for hosted deployments. SQLite remains the local and
    # test backend; a container filesystem is ephemeral, so Postgres is not
    # optional anywhere the process can be redeployed. See core/db.py.
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    # Real .docx for the printable 6 AM report. See requirements.txt.
    "python-docx>=1.1",
    "twilio>=9.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "anthropic>=0.34",
    "python-multipart>=0.0.9",
    # Windows has no IANA tz database; ingestion localises every exported
    # timestamp before converting it to UTC, so this is a correctness
    # dependency, not a convenience.
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# The Playwright fallback acquisition path (`--source ui`). Needs the browser
# binaries as well as the wheel:
#     pip install ".[ui]" && python -m playwright install chromium
# On Railway that means adding the Playwright buildpack; see README -> Deploying
# to Railway. Nothing else in the system requires it.
ui = [
    "playwright>=1.44",
]

[project.scripts]
towbook-agent = "towbook_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["towbook_agent*"]

[tool.setuptools.package-data]
towbook_agent = ["web/templates/*", "web/templates/**/*", "web/static/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
