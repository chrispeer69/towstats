# ==========================================================================
# rules.proposed.yaml -- the Analyst's suggestion box. NEVER auto-applied.
#
# The Analyst is the single LLM component in this system (hard constraint #3).
# When it notices something the rules do not cover -- a service type that keeps
# landing in `unclassified`, a client whose acceptance rate justifies its own
# alert threshold, a denial reason worth bucketing -- it writes a proposal
# here instead of editing rules.yaml.
#
# Nothing in this file has any effect on classification, metrics, alerting or
# notification. It is read only by the dashboard's "Proposed rules" view. A
# proposal becomes real when a HUMAN copies it into config/rules.yaml.
#
# That separation is deliberate. An LLM that can silently rewrite the rules
# that decide which jobs are worth taking is an LLM that can quietly change
# the business. Review, then paste.
#
# ENTRY FORMAT
# ------------
# Each proposal is one item under `proposals`, using the shape it would have
# in rules.yaml plus provenance:
#
#   proposals:
#     - id: prop-2026-07-28-heavy-duty       # stable, unique
#       proposed_at: 2026-07-28T06:00:00Z    # UTC
#       source_report: daily                 # hourly | daily | weekly
#       target: service_classes              # which rules.yaml section
#       rationale: >
#         41 requests in the last 14 days contained "heavy duty" and all of
#         them fell through to unclassified. They look like tows.
#       evidence:
#         sample_service_type_raw:
#           - "Heavy Duty Tow"
#           - "HEAVY DUTY RECOVERY"
#         affected_requests: 41
#         window: 2026-07-14..2026-07-27
#       # Paste this fragment into rules.yaml to accept the proposal.
#       patch:
#         service_classes:
#           heavy_duty:
#             match_any: [heavy duty, heavy-duty, semi, tractor trailer]
#       status: pending                      # pending | accepted | rejected
#       reviewed_by: null
#       reviewed_at: null
#
# The same shape works for an alert proposal (target: alerts) or a denial
# reason proposal (target: denial_reason_normalization).
# ==========================================================================
