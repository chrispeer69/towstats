# ==========================================================================
# companies.yaml -- the tenant roster.
#
# One entry per towing company this install reports on. The dashboard shows a
# company switcher as soon as there is more than one enabled entry, the
# scheduler runs the pipeline once per enabled company, and every row, every
# metric and every query is filtered by `id`.
#
# ---------------------------------------------------------------------------
# THE SWITCHER ALSO OFFERS "ALL COMPANIES (MERGED)".
#
# Two enabled entries and the dropdown grows a third choice, under "Together":
# every company's work read as one book. It is for the owner whose companies
# are one business -- here, Roadside takes the club work and Auto Lyft takes
# HONK's, out of one building -- so that "how much did WE turn away last week"
# has a page instead of being added up by hand.
#
# It is a way of READING, not a company. It has no entry in this file, no
# login, no Towbook company id, and the scheduler never runs a pipeline for it:
# it is recomputed from the members' own rows on every page load and stores
# nothing. The id `__all__` is reserved for it; an entry claiming that id is
# rejected with an error in the log.
#
# Where the members disagree about something the numbers depend on -- a staffed
# window, a timezone, a client's job value -- the merged view uses
# `default_company`'s setting and prints a sentence on the page saying so. It
# never silently blends two staffed windows into a coverage figure nobody could
# defend. Entries that agree print nothing, so the normal case is quiet.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# CREDENTIALS NEVER GO IN THIS FILE.
#
# This file is committed to git. It carries only the NAME of the environment
# variable prefix that holds a company's login:
#
#     credentials_env: ROADSIDE
#         ->  TOWBOOK_ROADSIDE_USER
#             TOWBOOK_ROADSIDE_PASS
#
# Leave `credentials_env` blank and the entry falls back to the plain
# TOWBOOK_USER / TOWBOOK_PASS pair, which is what an existing single-company
# install already has. Hard constraint #1 is unchanged: credentials come from
# the environment only, and the logging filter scrubs them from every log line.
# ---------------------------------------------------------------------------
# `id` IS STORED ON EVERY ROW.
#
# It is written to `requests.company_id`, `metrics_daily.company_id` and every
# other table. Changing it on a company that already has data orphans that
# data -- there is no rename path and there deliberately is not one, because a
# silent re-keying is indistinguishable from mixing two tenants together.
#
# The first entry below is deliberately `default`, not `roadside-towing`:
# `default` is the id every row written before this file existed already
# carries, so the original install keeps all of its history. Pick a real slug
# for any company you add from here on.
# ---------------------------------------------------------------------------
# OVERRIDE PRECEDENCE (later wins)
#
#     1. config/rules.yaml               the global default for every company
#     2. coverage:              ->  rules.yaml missed_work.coverage
#     3. job_value_by_client:   ->  rules.yaml missed_work.job_value_by_client
#     4. rules:                 ->  deep-merged over all of the above
#
# 2 and 3 REPLACE the global block outright rather than merging into it. A
# half-inherited staffed window or a half-inherited price list is a number
# nobody can defend. 4 merges mapping by mapping; a list or a scalar replaces,
# because `match_any` and `coverage.windows` are ordered decision tables and
# appending to them would change which rule fires first.
#
# DELETING THIS FILE IS SAFE. With no roster the system runs as a single
# company whose id is `default` and whose credentials are TOWBOOK_USER /
# TOWBOOK_PASS -- exactly the behaviour before this file existed.
# ==========================================================================

version: 1

# Which company the dashboard opens on and the CLI assumes when `--company` is
# not given. Must name an id below; an unknown value falls back to the first
# enabled entry and logs an error.
default_company: default

companies:
  # ------------------------------------------------------------------------
  # The original install. Verified live 2026-07-28: Towbook companyId 61343,
  # 2,996 offers over 30 days.
  # ------------------------------------------------------------------------
  - id: default
    name: Roadside Towing and Recovery Inc
    towbook_company_id: 61343
    # Blank -> TOWBOOK_USER / TOWBOOK_PASS, so nothing has to change in .env
    # for the install this system was built on.
    credentials_env: ""
    timezone: America/Detroit
    enabled: true

    # ----------------------------------------------------------------------
    # LETTERHEAD -- printed page only.
    #
    # The Print button on every tab opens the browser's print dialog; choose
    # "Save as PDF" there and this block becomes the header of the document.
    # None of it appears on screen, so it costs nothing to fill in and nothing
    # to leave blank: every field below is optional and empty ones are dropped
    # rather than printed as a blank line.
    #
    # `name` overrides the roster name for print only -- use it when the legal
    # entity above is not the trading name you put in front of a client.
    #
    # `logo`: drop the image into towbook_agent/web/static/ and name it here
    # (e.g. `logo: letterhead-logo.png`). An absolute path, a full URL or a
    # data: URI also work. Left blank, the name prints as a wordmark instead,
    # which is why this deployment has a working letterhead already. Keep it
    # under about 320px wide; it is scaled to 52px tall on the page.
    # ----------------------------------------------------------------------
    letterhead:
      name: ""
      logo: ""
      address: ""
      address2: ""
      city: ""
      state: ""
      zip: ""
      phone: ""
      email: ""
      website: ""

    # Per-company staffed window. Omit the block to inherit rules.yaml.
    # Measured on this account's real traffic: 5.8% of offers expire inside
    # this window, 61.7% outside it.
    coverage:
      windows:
        - name: covered
          days: [mon, tue, wed, thu, fri]
          start: "06:00"
          end: "18:00"
          note: >-
            Owner's stated staffed window, verified against 30 days of real
            Agero traffic.
      default_label: uncovered

    # Per-company average job values, keyed on the casefolded client name.
    # GROSS revenue, not margin. Supplied by the owner from invoice data --
    # Towbook's offerAmount is empty on 100% of records and no dollar figure is
    # ever derived from the feed.
    job_value_by_client:
      agero (swoop): 65
      allstate: 65
      nsd: 85
      allied dispatch solutions: 65
      urgent.ly: 65          # ASSUMPTION: not supplied by owner, flagged in reports

  # ------------------------------------------------------------------------
  # The second entity on the SAME Towbook login. Verified live 2026-08-01:
  # Towbook companyId 254467, 201 offers over 30 days, 100% of them HONK.
  #
  # ONE LOGIN, TWO COMPANIES. `credentials_env` is deliberately blank: this is
  # not a separate Towbook account, it is the same login (the one in
  # TOWBOOK_USER / TOWBOOK_PASS) switched to its other company with the book
  # icon in the top right of the portal. Acquisition performs that switch with
  # `GET /change?c=254467` and refuses to pull anything until the portal
  # confirms the session actually moved -- see agents/acquisition_api.py.
  #
  # `towbook_company_id` IS LOAD-BEARING HERE. On a single-company install it
  # is informational. On this one it is what the session is switched to, and a
  # wrong value would file one company's jobs under the other's name.
  # ------------------------------------------------------------------------
  - id: auto-lyft
    name: Auto Lyft USA, Inc
    towbook_company_id: 254467
    credentials_env: ""
    timezone: America/Detroit
    enabled: true

    letterhead:
      name: ""
      logo: ""
      address: "731 Mulberry St"
      address2: ""
      city: "Columbus"
      state: "OH"
      zip: "43219"
      phone: "614-633-7935"
      email: ""
      website: ""

    # Same owner, same dispatchers, same building as Roadside, so the staffed
    # window is the same. Stated explicitly rather than inherited because
    # `coverage` REPLACES rather than merges, and the coverage contrast is the
    # headline of every report -- it should never be a silent inheritance.
    coverage:
      windows:
        - name: covered
          days: [mon, tue, wed, thu, fri]
          start: "06:00"
          end: "18:00"
          note: >-
            Same staffed window as Roadside -- one owner, one dispatch desk,
            two legal entities.
      default_label: uncovered

    # HONK is the only client this entity is offered work by. $85 supplied by
    # the owner 2026-08-01, the same tier as NSD. GROSS revenue, not margin.
    job_value_by_client:
      honk: 85

  # ------------------------------------------------------------------------
  # TEMPLATE for the next tenant. Copy it, give it a real id, set
  # TOWBOOK_<PREFIX>_USER / _PASS in the environment, and flip `enabled`.
  #
  # Everything not named here is inherited from config/rules.yaml, so a new
  # company works on day one and is tuned afterwards.
  # ------------------------------------------------------------------------
  - id: example-towing
    name: Example Towing & Recovery
    towbook_company_id: ""
    credentials_env: EXAMPLE      # TOWBOOK_EXAMPLE_USER / TOWBOOK_EXAMPLE_PASS
    timezone: America/Chicago
    enabled: false

    # A Texas company is staffed different hours than an Ohio one. This is the
    # single most important per-company override: the coverage contrast is the
    # headline of every report, and it is wrong if the window is wrong.
    coverage:
      windows:
        - name: covered
          days: [mon, tue, wed, thu, fri, sat]
          start: "07:00"
          end: "19:00"
        - name: covered_overnight
          days: [fri, sat]
          start: "22:00"
          end: "06:00"
      default_label: uncovered

    job_value_by_client:
      agero (swoop): 80
      allstate: 75

    # Anything else in rules.yaml, deep-merged. Thresholds are the usual
    # reason: a low-volume company needs a lower min_offers before a blind
    # spot is real, and a different rate is "good" in a different market.
    rules:
      missed_work:
        blind_spot:
          min_offers: 3
          threshold: 0.30
        closeoff:
          min_offers: 4
        client_comparison:
          min_offers: 10
      dashboard:
        rate_thresholds:
          good: 0.70
          warn: 0.55
