# ==========================================================================
# companies.yaml -- THE DEMO ROSTER. NOT THE PRODUCTION ONE.
#
# This file is read only when TOWBOOK_REPO_ROOT points at demo-root/. The
# production roster lives at ../../config/companies.yaml and is untouched by
# anything in this directory.
#
# ---------------------------------------------------------------------------
# WHY THIS EXISTS AS A SEPARATE ROOT
#
# The demo tenant carries entirely synthetic data. Writing it into the live
# database would mean synthetic rows sitting permanently beside real customer
# records, distinguished only by a company_id -- one bad query away from a
# prospect's fake numbers appearing in a real customer's report, or worse, a
# real customer's numbers appearing in a public demo.
#
# `core/paths.py` reads TOWBOOK_REPO_ROOT and resolves config/, data/, state/
# and raw/ beneath it, while the CODE still loads from the installed package.
# So the demo runs the real application against a separate roster and a
# separate database, with no forked code path to drift.
#
#     TOWBOOK_REPO_ROOT=demo-root  DATABASE_URL=sqlite:///demo-root/data/demo.db
#
# ---------------------------------------------------------------------------
# THE DEMO TENANT IS THE `example-towing` TEMPLATE, TURNED ON.
#
# It keeps that id deliberately. An id is stamped on every row in every table
# and there is no rename path (see the production file's header), so the id a
# tenant is seeded under is the id it keeps. `example-towing` was already the
# reserved template slug, it collides with no real customer, and it reads
# honestly in a URL a prospect can see: /company/example-towing.
#
# ---------------------------------------------------------------------------
# NO CREDENTIALS, AND NOTHING HERE EVER CONTACTS TOWBOOK.
#
# `towbook_company_id` is blank and `credentials_env` names a prefix that is
# deliberately never set. The demo board is seeded data, served read-only. Run
# the demo with the scheduler OFF (`serve --no-scheduler`, or
# RUN_SCHEDULER=false) so no acquisition is ever attempted for a tenant that
# has no account to acquire from.
# ==========================================================================

version: 1

default_company: example-towing

companies:
  # ------------------------------------------------------------------------
  # The demo tenant. Every figure under this id is synthetic, generated by
  # scripts/seed_demo.py and ingested through the real pipeline -- the same
  # ingester, classifier and metrics passes that serve a paying customer. The
  # demo cannot disagree with the product, because it IS the product.
  #
  # Market: Dallas-Fort Worth. A different state and timezone from both real
  # tenants on purpose -- it exercises the per-company timezone path rather
  # than inheriting America/Detroit and looking correct by accident.
  # ------------------------------------------------------------------------
  - id: example-towing
    name: Summit Towing & Recovery
    towbook_company_id: ""
    # Never set. Named only so the entry is shaped like a real one; the demo
    # performs no acquisition. See the header.
    credentials_env: DEMO
    timezone: America/Chicago
    enabled: true

    letterhead:
      name: "Summit Towing & Recovery"
      logo: ""
      address: "4820 Industrial Blvd"
      address2: ""
      city: "Fort Worth"
      state: "TX"
      zip: "76106"
      phone: "817-555-0142"
      email: "dispatch@summittowing.example"
      website: "summittowing.example"

    # ----------------------------------------------------------------------
    # ONE staffed window, stated plainly: Monday to Saturday, 07:00-19:00.
    #
    # The template this entry came from also carried a `covered_overnight`
    # window for Friday and Saturday nights. It is dropped here on purpose.
    # The coverage contrast is the headline of every report and the whole
    # point of the demo, and a second window that covers half of two weekend
    # nights makes the uncovered set a shape nobody can hold in their head.
    # One window means the uncovered set is exactly "nights, and all day
    # Sunday" -- which a prospect understands in one sentence.
    # ----------------------------------------------------------------------
    coverage:
      windows:
        - name: covered
          days: [mon, tue, wed, thu, fri, sat]
          start: "07:00"
          end: "19:00"
          note: >-
            Demo tenant. Six days, one shift, nobody on the desk overnight or
            on Sunday -- the staffing pattern this product exists to price.
      default_label: uncovered

    # ----------------------------------------------------------------------
    # GROSS revenue per job, keyed on the casefolded client name.
    #
    # The club names are the same fictional ones the public marketing site and
    # the existing demo already use (tools/anonymize_all.py in the website
    # repo holds the mapping), so a prospect who reads the site and then opens
    # the demo sees one consistent universe instead of two.
    #
    # The dollar figures deliberately match the real tenants' tiers -- $65 for
    # most club work, $85 for the two that pay better. A demo whose rates are
    # invented lands on a missed-revenue figure an experienced operator will
    # not believe.
    # ----------------------------------------------------------------------
    job_value_by_client:
      meridian club: 65
      continental assurance: 65
      sentry roadside: 85
      pinnacle assist: 65
      vantage dispatch group: 65
      harbor motor club: 85

    # ----------------------------------------------------------------------
    # Thresholds. Inherited from rules.yaml except where the demo's volume
    # makes the global default wrong -- carried over from the template entry,
    # which was written for exactly this case.
    # ----------------------------------------------------------------------
    rules:
      missed_work:
        blind_spot:
          min_offers: 3
          threshold: 0.30
        closeoff:
          min_offers: 4
        client_comparison:
          min_offers: 10
      dashboard:
        rate_thresholds:
          good: 0.70
          warn: 0.55
